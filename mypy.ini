# Development-only: `mypy` (no arguments) checks the workspace modules listed here, which are clean;
# the tracker's own list is system/mypy.ini (run `mypy` in system/). The rest of the tree is not yet;
# add a module to `files` once it type-checks.  Imports outside the list are followed for their
# types but not reported (follow_imports = silent); mypy_path finds the tracker's packages.
[mypy]
python_version = 3.10
mypy_path = system
files =
    finetune/data/court_labels.py,
    finetune/data/event_labels.py,
    finetune/data/player_labels.py,
    finetune/labeling/label_candidates.py,
    finetune/labeling/label_court.py,
    finetune/labeling/label_players.py,
    finetune/labeling/label_timeline.py,
    finetune/labeling/label_view.py,
    finetune/scoring/court_score.py,
    finetune/scoring/hits_score.py,
    finetune/scoring/label_scoring.py,
    finetune/scoring/pipeline_score.py,
    finetune/scoring/players_score.py,
    finetune/scoring/rallies_score.py,
    finetune/scoring/scorecard.py,
    finetune/scoring/tracker_events.py,
    finetune/training/copy_paste.py,
    finetune/training/distill.py,
    finetune/training/pretrack.py,
    finetune/training/pseudo_labels.py,
    finetune/training/synthetic_clips.py,
    tools/coreml_speed_test/validate_coreml.py,
    tools/export_coreml.py,
    tools/live_lag_sweep.py
follow_imports = silent
ignore_missing_imports = True
