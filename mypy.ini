# Development-only: `mypy` (no arguments) checks the workspace modules listed here, which are clean;
# the tracker's own list is system/mypy.ini (run `mypy` in system/). The rest of the tree is not yet;
# add a module to `files` once it type-checks.  Imports outside the list are followed for their
# types but not reported (follow_imports = silent); mypy_path finds the tracker's packages.
[mypy]
python_version = 3.10
mypy_path = system
files =
    finetune/scoring/pipeline_score.py,
    finetune/training/copy_paste.py,
    finetune/training/distill.py,
    finetune/training/pretrack.py,
    finetune/training/pseudo_labels.py,
    tools/live_lag_sweep.py
follow_imports = silent
ignore_missing_imports = True
