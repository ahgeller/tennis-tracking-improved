# Development-only: `mypy` (no arguments) checks the modules listed here, which are clean.
# The rest of the tree is not yet; add a module to `files` once it type-checks.  Imports
# outside the list are followed for their types but not reported (follow_imports = silent).
[mypy]
python_version = 3.10
files =
    evaluation/validate.py,
    tennis_tracker/headless.py,
    tennis_tracker/tracking_schema.py,
    tennis_tracker/run_context.py,
    tennis_tracker/roi_tracking.py,
    tennis_tracker/engines/engine_files.py,
    tennis_tracker/ball_models.py,
    tennis_tracker/repvgg.py,
    tennis_tracker/heatmap_lite.py,
    tennis_tracker/streamnet.py,
    tennis_tracker/wasbnet.py,
    tennis_tracker/engines/ball_gpu.py,
    tennis_tracker/engines/ball_trt.py,
    tennis_tracker/engines/ball_detectors.py,
    tennis_tracker/engines/ball_prepass_process.py,
    tennis_tracker/video_decode.py,
    tennis_tracker/cuda_kernels.py,
    tennis_tracker/motion_gpu.py,
    tennis_tracker/motion.py
follow_imports = silent
ignore_missing_imports = True
